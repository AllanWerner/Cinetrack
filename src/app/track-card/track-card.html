<!-- src/app/track-card/track-card.html -->
<article
  class="card"
  [class.active]="active()"
  [attr.aria-pressed]="active()"
  role="button"
  tabindex="0"
  (click)="selectTrack()"
  (keydown.enter)="selectTrack()"
  (keydown.space)="selectTrack()"
  [appHighlightFavorite]="track().favorite"
>
  <img [src]="track().coverUrl" [alt]="track().title" />
  <h3>{{ track().title }}</h3>
  <p>{{ track().artist }}</p>
  <p class="duration">{{ track().durationSeconds | durationFormat }}</p>
  @if (active()) {
    <span class="badge muted">En lecture</span>
  }
 @switch (true) {
  @case (track().rating >= 9) { <span class="badge gold">⭐ Coup de cœur</span> }
  @case (track().rating >= 7) { <span class="badge">👍 Recommandé</span> }
  @default { <span class="badge muted">À découvrir</span> }
}
</article>
