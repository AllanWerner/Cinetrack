<div class="app-container">
  <h1>CinéTrack</h1>
  
  <div class="form-section">
    <app-track-form (add)="addTrack($event)" />
  </div>
  
  <div class="list-section">
    <app-track-list 
      [tracks]="tracks()" 
      (trackSelected)="selectTrack($event)" />
  </div>

  @if (selectedTrack.id(); as trackId) {
    <div class="detail-section">      
      <app-track-detail [trackId]="selectedTrack.id()!" />
    </div>
  }
</div>
